name: Build Android APK

on:
  push:
    branches: [ main, master, saas-version ]
  pull_request:
    branches: [ main, master, saas-version ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK with Gradle
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: Sign Release APK
      working-directory: ./android
      run: |
        keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass "password123" -keypass "password123" -dname "CN=Majolica, O=Majolica, C=MA"
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-aligned.apk
        $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-key-alias release --ks-pass pass:"password123" --key-pass pass:"password123" --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-aligned.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Majolica-POS-Release-APK
        path: android/app/build/outputs/apk/release/app-release-signed.apk

    - name: Create or Update Public Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Dernière Version (Latest)
        files: android/app/build/outputs/apk/release/app-release-signed.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
